name: jobbot

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max LLM calls for this run (blank = config default)"
        required: false

concurrency:
  group: jobbot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Always start from the latest code and state, even when re-running an older run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LIMIT: ${{ inputs.limit }}
        run: python -m jobbot run ${LIMIT:+--limit "$LIMIT"}

      # Runs even if the bot reported errors, so progress (scores, Notion page ids, sent notifications) is kept.
      # state.json is only written by the bot, so this run's copy replaces the branch's copy wholesale
      # (a line-by-line merge of two JSON snapshots conflicts or corrupts the file).
      - name: Commit state
        if: always()
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [ -f data/state.json ] || exit 0
          git config user.name "jobbot"
          git config user.email "jobbot@users.noreply.github.com"
          cp data/state.json "$RUNNER_TEMP/state.json"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            cp "$RUNNER_TEMP/state.json" data/state.json
            git add data/state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit --quiet -m "Update job bot state"
            if git push --quiet origin "HEAD:$BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
