# Job Bot configuration.
# Secrets (GEMINI_API_KEY, NOTION_TOKEN, NOTION_DATA_SOURCE_ID, NTFY_TOPIC) come from the environment:
# a local .env file, or repository secrets in GitHub Actions.

term: Summer 2027
state_path: data/state.json

# Read in this order. A posting found in several places is kept once (matched by the employer's job ID),
# and a source that can't be read is skipped for that run with a warning.
sources:
  simplify:
    enabled: true
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
  zshah101:          # automated list that polls ~4,800 employer job boards every 30 minutes
    enabled: true
    url: https://raw.githubusercontent.com/zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships/main/data/internships.csv
  speedyapply:       # curated US software internship table, updated daily
    enabled: true
    url: https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
  # Poll the Greenhouse/Lever/Ashby boards of every company seen in any list. Catches postings days before
  # (or instead of) the lists.
  company_boards:
    enabled: true
    max_boards: 300
  # Extra boards to always poll, e.g. companies that haven't shown up in any list yet.
  ats_watchlist:
    enabled: false
    greenhouse: []   # board tokens from job-boards.greenhouse.io/<token>
    lever: []        # company slugs from jobs.lever.co/<company>
    ashby: []        # org slugs from jobs.ashbyhq.com/<org>

# Title matching (case-insensitive regexes). A listing must match a role group to be considered.
roles:
  groups:
    swe:
      weight: 1.0
      patterns:
        - '\bsoftware\b'
        - '\bswe\b'
        - '\bdevelopers?\b'
        - '\bprogramm(er|ing)\b'
        - '\b(front|back)[- ]?end\b'
        - '\bfull[- ]?stack\b'
        - '\bweb\b'
        - '\bmobile\b'
        - '\bios\b'
        - '\bandroid\b'
        - '\b(platform|infrastructure|cloud|devops|reliability|security|product|applications?|forward deployed) engineer'
        - '\bsre\b'
        - '\bcomputer science\b'
    ux:
      weight: 1.0
      patterns:
        - '\bux\b'
        - '\bui\b'
        - '\buser (experience|interface|research)\b'
        - '\b(product|interaction|visual|experience|web) design'
        - '\bdesign technologist'
        - '\bdesigner\b'
        - '\bhuman[- ]computer interaction\b'
        - '\bhci\b'
        - '\bcreative technologist\b'
    embedded:
      weight: 0.8
      patterns:
        - '\bembedded\b'
        - '\bfirmware\b'
        - '\bsystems? software\b'
        - '\brobotics\b'
        - '\bautonomy\b'
        - '\bfpga\b'
        - '\bcomputer engineer'
        - '\bhardware\b'
    generic:
      weight: 0.5
      overrides_soft_exclude: false
      patterns:
        - '\bengineer(ing)?\b'
        - '\btechnology\b'
        - '\bmultiple teams\b'
  # Always dropped (degree level / seniority).
  hard_exclude:
    - '\bph\.?\s?d\b'
    - '\bmba\b'
    - '\bmaster''?s\b'
    - '\bgraduate[- ]level\b'
    - '\b(senior|sr\.|staff|principal|director|manager)\b'
  # Dropped unless the title also matches swe/ux/embedded ("Software Engineer - Trading" survives).
  soft_exclude:
    - '\bproduct manag'
    - '\bsales\b'
    - '\bmarketing\b'
    - '\b(accounting|finance|financial|audit|tax|legal|compliance|recruiting|human resources)\b'
    - '\b(mechanical|civil|chemical|electrical|manufacturing|process|industrial|materials|structural|aerospace) engineer'
    - '\b(asic|physical|analog|circuit|silicon|layout) design'
    - '\bdesign verification\b'
    - '\bquantitative\b'
    - '\btrad(er|ing)\b'
    - '\bresearch scientist\b'
    - '\bdata (scien|analy)'
    - '\bbusiness\b'
    - '\bsupply chain\b'
    - '\boperations\b'

# Where the job is. In-person and hybrid roles outside the US are dropped before scoring; remote roles are kept
# unless they're restricted to another country ("Remote in Canada"). Preferred areas add bonus points to the final score.
location:
  us_only: true
  preferred:
    - name: St. Louis
      bonus: 8
      patterns:
        - '\bst\.?\s+louis\b'
        - '\bsaint\s+louis\b'
        - '\bstl\b'
        - '\b(clayton|chesterfield|creve coeur|maryland heights|st\.? charles|st\.? peters|o''fallon|earth city|kirkwood|des peres|town and country|brentwood|fenton|hazelwood|florissant|ballwin|webster groves|university city|wentzville),\s*mo\b'
        - '\b(belleville|edwardsville|o''fallon|collinsville|scott air force base),\s*il\b'
    - name: Bozeman
      bonus: 8
      patterns:
        - '\bbozeman\b'
        - '\b(belgrade|big sky),\s*mt\b'

# Free pre-score (0-100): keyword overlap with your skills + local embedding similarity.
# Orders the LLM queue. Listings below min_score skip the LLM, except titles in always_score_groups.
prefilter:
  min_score: 25
  always_score_groups: [swe, ux]
  keyword_weight: 0.45
  embedding_weight: 0.55
  keyword_saturation: 6        # this many distinct skill hits = full keyword score
  use_embeddings: true
  embedding_model: BAAI/bge-small-en-v1.5
  similarity_floor: 0.55       # cosine similarity mapped to 0
  similarity_ceiling: 0.85     # cosine similarity mapped to 100

jd:
  min_chars: 300               # shorter than this counts as "no job description"
  max_chars: 30000             # longer JDs are skipped with a warning rather than truncated
  concurrency: 8
  per_host_concurrency: 3
  timeout_seconds: 20
  # Career sites that embed Greenhouse jobs (?gh_jid=...) under a board name that can't be guessed.
  greenhouse_boards:
    zipline.com: flyzipline

# Free-tier limits (AI Studio > Rate limits): Gemini 3.5 Flash-Lite allows 15 requests/min and 500/day.
# The Flash models (3.5-3.8) allow only 5/min and 20/day, too few for this workload.
llm:
  model: gemini-3.5-flash-lite
  rpm: 12                      # a little under the 15/min limit
  daily_budget: 450            # stop before the 500/day limit (counted per UTC day; Google resets at midnight Pacific)
  max_per_run: 120
  max_attempts: 3              # give up on a listing after this many unusable responses

scoring:
  fit_weight: 0.85
  logistics_weight: 0.15
  eligibility_cap: 40          # max score when the posting's grad window / degree clearly excludes you
  unknown_pay_factor: 0.95
  # Preference order: in-person + relocation + paid > remote + paid > in-person + paid > remote unpaid > in-person unpaid
  logistics:
    onsite_relocation_paid: 100
    remote_paid: 85
    onsite_paid: 70
    remote_unpaid: 35
    onsite_unpaid: 20

# Calibrated on Gemini 3.5 Flash-Lite with the strict rubric in jobbot/llm/prompt.py: clear fits land 82+,
# roles missing a core skill (e.g. C++, Go, TypeScript) land around 68-76.
tiers:
  notify_threshold: 82         # push notification + Notion
  good_threshold: 70           # Notion
  track_threshold: 55          # Notion; below this is only kept in state

notify:
  enabled: true
  server: https://ntfy.sh
  max_per_run: 8               # extra strong matches in one run are folded into a digest
  notify_without_jd: false     # push even when the job description couldn't be read

notion:
  enabled: true
  requests_per_second: 2.5
